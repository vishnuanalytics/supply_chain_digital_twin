name: CI

# Runs the pytest suite (agent/utils.py's parsing, simulate_scenario's deterministic
# math, db.py's read-only + upsert-validation guards, the LLM provider fallback chain,
# the Jev decision-engine fallback, and the eval harness's own answer-checking logic)
# on every push and PR. Deliberately does NOT run eval/run_eval.py here - that needs
# live Neo4j/Postgres/LLM-provider credentials and burns real free-tier quota per run,
# neither of which belong in a public CI job that runs on every push. Run it manually
# (`python3 eval/run_eval.py`) against your own .env when you want a live pass rate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v
